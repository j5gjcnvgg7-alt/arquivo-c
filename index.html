<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARQUIVO C — Acesso Negado</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="noise"></div>

  <main class="container">

    <header class="top-bar">
      <span>ARQUIVO C</span>
      <span id="clock">00:00:00</span>
    </header>

    <section class="main-content">

      <div class="file-number">
        C / 001
      </div>

      <div class="symbol">
        C
      </div>

      <h1>
        ARQUIVO C
      </h1>

      <div class="classification">
        DOCUMENTO CLASSIFICADO
      </div>

      <div class="access-box">

        <div class="lock">
          🔒
        </div>

        <div class="access-title">
          ACESSO NEGADO
        </div>

        <div class="line"></div>

        <p>
          Este documento encontra-se temporariamente indisponível.
        </p>

        <p class="small">
          O conteúdo será desbloqueado quando o acesso for autorizado.
        </p>

      </div>

      <div class="loading">
        <span>VERIFICAÇÃO DO ARQUIVO</span>
        <div class="loading-bar">
          <div></div>
        </div>
      </div>

      <div class="status">
        <span class="dot"></span>
        SISTEMA ONLINE
      </div>

    </section>

    <footer>

      <span>CLASSIFIED // C</span>

      <span id="date"></span>

      <span>ACCESS LEVEL: 00</span>

    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
